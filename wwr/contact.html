<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | MU2K Whitewater Adventures</title>
    <meta name="description"
      content="Get in touch with MU2K Whitewater Adventures. Contact us with questions about rafting trips, reservations, or website feedback. We are ready to help!">
    <meta name="author" content="Ssenabulya Jonathan">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <!-- rafting logo -->
        <img src="images/logo.jpg" alt="rafting site logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-main">


        <!-- Company Information & Map Section -->
        <section class="company-info-section">
            <div class="info-details">
                <h1>MU2K Whitewater Adventures</h1>
                <p><strong>Address:</strong> 123 River Rapids Road, Jinja, Uganda</p>
                <p><strong>Phone:</strong> +256 751 562862</p>
                <p><strong>Email:</strong> sjonathan2@byupathway.edu</p>
            </div>


        </section>

        <!-- Contact Form Section -->
        <div class="form-section">
            <div class="map-container">
                <!-- Google Map iframe -->
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d15959.0123456789!2d33.2000!3d0.4300!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMKKwMjUnNDguMCJOIDMzwrAxMicyMC4wIkU!5e0!3m2!1sen!2sug!4f1!5m2!1sen!2sug"
                  height="460" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
            <form action="#" method="post">

                <!-- User Name -->
                <label for="fullname">Your Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <!-- User Email -->
                <label for="email">Your Email Address:</label>
                <input type="email" id="email" name="email" required>

                <!-- Radio Buttons for Purpose of Message -->
                <fieldset>
                    <legend>Purpose of Message:</legend>
                    <label>
                        <input type="radio" name="purpose" id="purpose1" value="general" required>
                        General Inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="purpose2" value="reservation">
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" id="purpose3" value="suggestion"> Website
                        Suggestion
                    </label>
                </fieldset>

                <!-- Message Textarea -->
                <label for="message">Your Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <!-- Newsletter Checkbox -->
                <label class="checkbox-label">
                    <input type="checkbox" name="newsletter" id="checkbox-label" value="subscribed">
                    Please
                    subscribe me
                    to the monthly newsletter
                </label>

                <!-- Submit Button -->
                <button type="submit" class="submit-btn">Get in Touch</button>

            </form>
        </div>

        <!-- Employee Profiles Section (At least 3 employees with titles) -->
        <section class="employee-section">
            <h2>Our Team</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/ceo.jpg" alt="John Doe - Lead Guide">
                    <figcaption>John Doe — Lead River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/ceo1.jpg" alt="Jane Smith - Safety Coordinator">
                    <figcaption>Jane Smith — Safety Coordinator</figcaption>
                </figure>
                <figure>
                    <img src="images/ceo2.jpg" alt="Mark Johnson - Reservation Manager">
                    <figcaption>Mark Johnson — Reservation Manager</figcaption>
                </figure>
            </div>
        </section>


    </main>

    <footer>
        <p>&copy; 2026 MU2K WHITEWATER ADVENTURES. SSENABULYA JONATHAN</p>
        <nav class="socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg"
                  alt="instagram logo"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="linkedin logo"></a>
        </nav>
    </footer>
</body>

</html>
