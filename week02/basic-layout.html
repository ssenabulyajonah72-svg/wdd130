<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTML Structure</title>
    <meta name="description" content="A basic HTML using semantic HTML elements">
    <meta name="author" content="Ssenabulya Jonathan">
</head>
<body>
    <header>
        <img src="images/basic-logo.png" alt="computer image with semantic tags" width="128" height="128">
    </header>
    <nav>
        <ul>
            <li><a href="https://www.programiz.com/">Programiz</a></li>
            <li><a href="https://www.programiz.com/python-programming/online-compiler/">Python Compiler</a></li>
        </ul>
    </nav>
    <main>
        <h1>Basic HTML Structure</h1>

        <!--- First section --->
        <section>
            <h2> Heading </h2>
            <p> This is my paragraph</p>
        </section>
        
        <!--- second section --->
        <section>
            <h2> Heading 2</h2>
            <p> This is my second paragraph</p>
        </section>

        <aside>
            <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/adelaide-australia/800x450/adelaide-australia-temple-lds-866420-wallpaper.jpg" alt="Church image" width="200">

        </aside>
        <footer>
            <p> Ssenabulya Jonathan</p>
        </footer>
    </main>
</body>
</html>
